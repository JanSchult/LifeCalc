[versions]
agp                  = "8.13.2"
firebaseBom = "34.14.1"
kotlin               = "2.1.0"
coreKtx              = "1.17.0"
lifecycleRuntimeKtx  = "2.10.0"
activityCompose      = "1.12.4"
composeBom           = "2024.09.00"
coilCompose = "3.2.0"
navigationCompose = "2.8.3"
kotlinSerialization = "1.6.3"
koinBom = "4.1.0-Beta4"
roomRuntime = "2.8.3"
kspVersion = "2.0.21-1.0.27"
crashlytics       = "3.0.2"
splashscreen = "1.0.1"


# Neu hinzugefügt
datastorePreferences = "1.1.7"
coroutines           = "1.10.2"
billing              = "7.1.1"

# Test
junit                = "4.13.2"
junitVersion         = "1.3.0"
espressoCore         = "3.7.0"

[libraries]
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
# ── AndroidX Core ──────────────────────────────────────────
androidx-core-ktx              = { group = "androidx.core",      name = "core-ktx",              version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose      = { group = "androidx.activity",  name = "activity-compose",      version.ref = "activityCompose" }

# ── Compose BOM + UI ───────────────────────────────────────
androidx-compose-bom              = { group = "androidx.compose",          name = "compose-bom",          version.ref = "composeBom" }
androidx-compose-ui               = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics      = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling       = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
androidx-compose-ui-test-junit4   = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-compose-material3        = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons   = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Navigation (Compose) ───────────────────────────────────
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }
# ── Lifecycle ViewModel Compose ────────────────────────────
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }

# ── Room ──────────────────────────────────────────────────
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomRuntime" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomRuntime" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }

# ── Coroutines ────────────────────────────────────────────
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── Billing ───────────────────────────────────────────────
billing = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# ── DataStore ─────────────────────────────────────────────
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# ── Test ──────────────────────────────────────────────────
junit                  = { group = "junit",                    name = "junit",          version.ref = "junit" }
androidx-junit         = { group = "androidx.test.ext",        name = "junit",          version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso",   name = "espresso-core",  version.ref = "espressoCore" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }


[plugins]
android-application  = { id = "com.android.application",            version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt          = { id = "org.jetbrains.kotlin.kapt",           version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kspVersion" }
google-services      = { id = "com.google.gms.google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics",  version.ref = "crashlytics"    }